# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR object detection model with OriModule + TransModule + ResNet50 + DynamicAlignFusion

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# OriModule + TransModule + ResNet50 + DynamicAlignFusion Architecture
backbone:
  # [from, repeats, module, args]
  
  # 原始特征分支 - OriModule保存原始图片特征
  - [-1, 1, OriModule, []]  # 0-P1/1 - 保存原始特征
  
  # 变换特征分支 - TransModule获取变换图片特征
  - [-1, 1, TransModule, [3, 1.0, 0.2]]  # 1-P1/1 - 变换特征

  # 阶段1对齐
  - [0, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']]  # 2-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]  # 3

  - [1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']]  # 4-P2/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]  # 5

  - [[3, 5], 1, DynamicAlignFusion, [32]]  # 6

  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]  # 7
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]  # 8-P2/4
  
  # ResNet50 Stage 1 - 变换特征
  - [-1, 1, Blocks, [64, BottleNeck, 3, 2, 'relu']]  # 9
  - [-1, 1, Blocks, [128, BottleNeck, 4, 3, 'relu']]  # 10-P3/8
  - [-1, 1, Blocks, [256, BottleNeck, 23, 4, 'relu']]  # 11-P4/16
  - [-1, 1, Blocks, [512, BottleNeck, 3, 5, 'relu']]  # 12-P5/32

head:
  # 输入投影层
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input_proj.2
  
  # AIFI注意力机制
  - [-1, 1, AIFI, [1024, 8]]  # 14
  
  # 上采样和特征融合
  - [-1, 1, Conv, [256, 1, 1]]  # 15, Y5, lateral_convs.0
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 16
  - [19, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 17 input_proj.1
  - [[-2, -1], 1, Concat, [1]]  # 18
  - [-1, 3, RepC3, [256, 0.5]]  # 19, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]  # 20, Y4, lateral_convs.1
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 21
  - [18, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 22 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 23
  - [-1, 3, RepC3, [256, 0.5]]  # 24, fpn_blocks.1
  
  - [-1, 1, Conv, [256, 3, 2]]  # 25, downsample_convs.0
  - [[-1, 28], 1, Concat, [1]]  # 26
  - [-1, 3, RepC3, [256, 0.5]]  # 27, pan_blocks.0
  
  - [-1, 1, Conv, [256, 3, 2]]  # 28, downsample_convs.1
  - [[-1, 23], 1, Concat, [1]]  # 29
  - [-1, 3, RepC3, [256, 0.5]]  # 30, pan_blocks.1
  
  # RT-DETR Decoder
  - [[32, 35, 38], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5) 