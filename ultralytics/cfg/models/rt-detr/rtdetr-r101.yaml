# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-l object detection model with P3-P5 outputs. For details see https://docs.ultralytics.com/models/rtdetr

# Parameters
nc: 1  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 2048]

# From BiliBili 魔鬼面具
backbone:
  # [from, repeats, module, args]
  - [-1, 1, OriModule, []] # 0 
  - [-1, 1, TransModule, [3, 0.1, 0.5]] # 1 

  - [0, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 2-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 3
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 4

  - [1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 5-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 6
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 7

  # FAM模块：融合第4层和第7层的特征
  - [[4, 7], 1, FAM2D, [64, 64]] # 8-FAM

  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 9-P2/4
  
  # [ch_out, block_type, block_nums, stage_num, act, variant]
  - [-1, 1, Blocks, [64, BottleNeck, 3, 2, 'relu']] # 10
  - [-1, 1, Blocks, [128, BottleNeck, 4, 3, 'relu']] # 11-P3/8
  - [-1, 1, Blocks, [256, BottleNeck, 23, 4, 'relu']] # 12-P4/16
  - [-1, 1, Blocks, [512, BottleNeck, 3, 5, 'relu']] # 13-P5/32

head:
  - [-1, 1, Conv, [384, 1, 1, None, 1, 1, False]]  # 14 input_proj.2
  - [-1, 1, AIFI, [2048, 8]] # 15
  - [-1, 1, Conv, [384, 1, 1]]  # 16, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17
  - [12, 1, Conv, [384, 1, 1, None, 1, 1, False]]  # 18 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 19
  - [-1, 3, RepC3, [384]]  # 20, fpn_blocks.0
  - [-1, 1, Conv, [384, 1, 1]]   # 21, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 22
  - [11, 1, Conv, [384, 1, 1, None, 1, 1, False]]  # 23 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 24 cat backbone P4
  - [-1, 3, RepC3, [384]]    # X3 (25), fpn_blocks.1

  - [-1, 1, Conv, [384, 3, 2]]   # 26, downsample_convs.0
  - [[-1, 21], 1, Concat, [1]]  # 27 cat Y4
  - [-1, 3, RepC3, [384]]    # F4 (28), pan_blocks.0

  - [-1, 1, Conv, [384, 3, 2]]   # 29, downsample_convs.1
  - [[-1, 16], 1, Concat, [1]]  # 30 cat Y5
  - [-1, 3, RepC3, [384]]    # F5 (31), pan_blocks.1

  - [[25, 28, 31], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 6]]  # Detect(P3, P4, P5)
